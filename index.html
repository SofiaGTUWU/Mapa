<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mapa 3D </title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>


<body>
  <a-scene background="color: #87CEEB">

    <a-assets>
      <a-asset-item id="miModelo" src="3D/result (1).glb"></a-asset-item>
       <a-asset-item id="miModelo2" src="3D/CASINO.glb"></a-asset-item>
    </a-assets>


    <a-entity
      geometry="primitive: plane; width: 10; height: 10; segmentsWidth: 256; segmentsHeight: 256"
      material="color: #73913B; displacementMap: #heightMap; displacementScale: 2.5; roughness: 1; metalness: 0"
      rotation="-90 0 0"
      position="0 0 -6"
       scale="20 24 20">
    </a-entity>


    <a-entity
      id="elModelo"
      gltf-model="#miModelo"
      position="0 1 -6"
      scale="24 24 24"
      rotation="0 0 0">
    </a-entity>
 
     <a-entity
        id="elModelo2"
        gltf-model="#miModelo2"
        position="-1 10 -27"
        scale="20 20 20"
        rotation="0 0 0">
      </a-entity>

    <a-entity light="type: directional; intensity: 0.9; castShadow: true" position="2 4 2"></a-entity>
    <a-entity light="type: ambient; intensity: 0.6"></a-entity>

    <!-- Cámara con movimiento (WASD + mouse), limitada a los bordes del modelo -->
    <a-entity
      camera
      look-controls
      wasd-controls
      limite-mundo="target: #elModelo; margin: 0.3"
      position="0 3 0">
    </a-entity>

  </a-scene>





  
</body>
</html>
