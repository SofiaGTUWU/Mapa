<!DOCTYPE html>
<html>
<head>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>

<body>

<a-scene>

  <!-- ========================= -->
  <!-- ISLA PRINCIPAL -->
  <!-- ========================= -->

  <a-box
    position="0 0 -5"
    width="10"
    height="1"
    depth="10"
    color="#D8D5C8">
  </a-box>

  <!-- Segunda capa de la isla -->
  <a-box
    position="0 -0.7 -5"
    width="8"
    height="1"
    depth="8"
    color="#A89F8C">
  </a-box>


  <!-- ========================= -->
  <!-- ÁRBOLES -->
  <!-- ========================= -->

  <!-- Árbol 1 -->
  <a-cylinder
    position="-3 1 -5"
    radius="0.25"
    height="2"
    color="#765438">
  </a-cylinder>

  <a-cone
    position="-3 2.2 -5"
    radius-bottom="1.2"
    radius-top="0"
    height="2"
    color="#D9D7C8">
  </a-cone>

  <a-cone
    position="-3 3.3 -5"
    radius-bottom="0.9"
    radius-top="0"
    height="1.6"
    color="#D9D7C8">
  </a-cone>


  <!-- Árbol 2 -->
  <a-cylinder
    position="2 1 -3"
    radius="0.25"
    height="2"
    color="#765438">
  </a-cylinder>

  <a-cone
    position="2 2.2 -3"
    radius-bottom="1.1"
    radius-top="0"
    height="2"
    color="#D9D7C8">
  </a-cone>

  <a-cone
    position="2 3.2 -3"
    radius-bottom="0.8"
    radius-top="0"
    height="1.5"
    color="#D9D7C8">
  </a-cone>


  <!-- Árbol 3 -->
  <a-cylinder
    position="3 1 -7"
    radius="0.2"
    height="1.8"
    color="#765438">
  </a-cylinder>

  <a-cone
    position="3 2.1 -7"
    radius-bottom="1"
    radius-top="0"
    height="1.8"
    color="#D9D7C8">
  </a-cone>

  <a-cone
    position="3 3.1 -7"
    radius-bottom="0.7"
    radius-top="0"
    height="1.4"
    color="#D9D7C8">
  </a-cone>


  <!-- ========================= -->
  <!-- ROCAS -->
  <!-- ========================= -->

  <a-sphere
    position="-1 0.7 -4"
    radius="0.5"
    scale="1 0.7 1"
    color="#85847D">
  </a-sphere>

  <a-sphere
    position="1 0.6 -6"
    radius="0.4"
    scale="1.2 0.7 1"
    color="#85847D">
  </a-sphere>

  <a-sphere
    position="-3 0.5 -7"
    radius="0.35"
    scale="1 0.6 1"
    color="#85847D">
  </a-sphere>


  <!-- ========================= -->
  <!-- HONGOS -->
  <!-- ========================= -->

  <a-cylinder
    position="-1.5 0.6 -6"
    radius="0.08"
    height="0.6"
    color="#D6D0B8">
  </a-cylinder>

  <a-sphere
    position="-1.5 0.95 -6"
    radius="0.3"
    scale="1 0.5 1"
    color="#B85C45">
  </a-sphere>


  <a-cylinder
    position="1 0.5 -4"
    radius="0.06"
    height="0.5"
    color="#D6D0B8">
  </a-cylinder>

  <a-sphere
    position="1 0.8 -4"
    radius="0.25"
    scale="1 0.5 1"
    color="#B85C45">
  </a-sphere>


  <!-- ========================= -->
  <!-- PLANTAS -->
  <!-- ========================= -->

  <a-cone
    position="-2 0.8 -4"
    radius-bottom="0.3"
    radius-top="0"
    height="0.8"
    color="#8E9B72">
  </a-cone>

  <a-cone
    position="2 0.7 -6"
    radius-bottom="0.3"
    radius-top="0"
    height="0.7"
    color="#8E9B72">
  </a-cone>


  <!-- ========================= -->
  <!-- TU CÓDIGO ORIGINAL -->
  <!-- ========================= -->

  <a-box
    position="-1 0.5 -3"
    rotation="0 45 0"
    color="#4CC3D9">
  </a-box>

  <a-sphere
    position="0 1.25 -5"
    radius="1.25"
    color="#EF2D5E">
  </a-sphere>

  <a-cylinder
    position="1 0.75 -3"
    radius="0.5"
    height="1.5"
    color="#FFC65D">
  </a-cylinder>

  <a-plane
    position="0 0 -4"
    rotation="-90 0 0"
    width="4"
    height="4"
    color="#7BC8A4">
  </a-plane>


  <!-- ========================= -->
  <!-- CIELO -->
  <!-- ========================= -->

  <a-sky color="#123D45"></a-sky>


  <!-- ========================= -->
  <!-- CÁMARA -->
  <!-- ========================= -->

  <a-camera position="0 7 8" rotation="-35 0 0"></a-camera>

</a-scene>

</body>
</html>
